<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Focus Timer · Sample demo</title><link rel="stylesheet" href="./demo.css"><script defer src="./demo.js?v=8d3f0f2"></script></head><body data-demo="focus"><main><span class="badge">DEMO / 02</span><h1>Make time to focus</h1><p>One thing at a time.</p><div class="row"><label for="minutes">Focus duration (1–120 minutes)</label><input id="minutes" type="number" min="1" max="120" step="1" value="25"></div><output id="timer" aria-label="Time remaining">25:00</output><p id="timer-status" role="status" aria-live="polite">Ready when you are.</p><div class="row"><button id="start">Start focusing</button><button id="reset" class="secondary">Reset</button></div><p style="font-size:12px;margin-top:20px">Closing or refreshing the page resets the timer. Background notifications are not supported.</p><a class="back" href="../index.html" target="_top">← Back to portfolio</a></main></body></html>
