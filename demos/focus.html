<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>專注計時器 · 示範</title><link rel="stylesheet" href="./demo.css"><script defer src="./demo.js"></script></head><body data-demo="focus"><main><span class="badge">DEMO / 02</span><h1>留一點時間，專注</h1><p>一次只做一件事，就很好。</p><div class="row"><label for="minutes">專注分鐘數（1–120）</label><input id="minutes" type="number" min="1" max="120" step="1" value="25"></div><output id="timer" aria-label="剩餘時間">25:00</output><p id="timer-status" role="status" aria-live="polite">準備好了，就開始。</p><div class="row"><button id="start">開始專注</button><button id="reset" class="secondary">重設</button></div><p style="font-size:12px;margin-top:20px">示範：關閉或重新整理頁面會重設計時；不提供背景通知。</p><a class="back" href="../index.html" target="_top">← 返回作品網站</a></main></body></html>
